name: Build & Deploy Bot Hub

# Canonical native pipeline: arcd self-hosted runners -> GHCR -> DOKS, via the
# reusable docker-build workflow. Replaces the previous GitHub-hosted build
# (runs-on: ubuntu-latest) + doctl/kubectl deploy — both off-pattern: NO GitHub
# builders, and no DIGITALOCEAN_ACCESS_TOKEN handling here (the ARC deploy
# runner has in-cluster access). vercel.json removed in the same change.
#
# amd64-only: do-sfo3-hanzo-k8s nodes are amd64 and the running image has always
# been amd64. The reusable pins an immutable per-build tag (no :latest), then
# `kubectl set image` rolls deployment/bot-hub in ns hanzo to it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/bot-hub
      platforms: linux/amd64
      deploy: true
      deploy-deployment: bot-hub
      deploy-namespace: hanzo
    secrets: inherit
